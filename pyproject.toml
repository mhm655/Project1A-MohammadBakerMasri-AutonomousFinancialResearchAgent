[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ara1-research-agent"
version = "0.3.0"
description = "ARA-1: an autonomous financial research agent with multi-source synthesis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohammad Baker Masri" }]
dependencies = [
    "openai>=1.40",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "jsonschema>=4.21",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rich>=13",
    "tiktoken>=0.7",
    "yfinance>=0.2.40",
    "ddgs>=9.0",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "memory*", "synthesis*", "evaluation*", "config*"]

[tool.setuptools.package-data]
tools = ["schemas/*.json"]
config = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not network'"
markers = [
    "network: needs internet access (deselect with -m 'not network')",
]
filterwarnings = [
    # Third-party deprecation noise under Python 3.14; not actionable in this project.
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D1"]
# D107/D105: constructor arguments are documented in the class docstring instead.
ignore = ["E501", "D107", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
