<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t  { fill:#0f172a; font-size:13px; font-weight:600; }
      .m  { fill:#0f172a; font-size:13px; font-weight:600; font-family: Consolas, Menlo, monospace; }
      .s  { fill:#475569; font-size:11px; }
      .h  { fill:#334155; font-size:12px; font-weight:700; letter-spacing:1px; }
      .l  { fill:#334155; font-size:10px; }
      .ln { stroke:#334155; stroke-width:1.4; fill:none; }
      .col{ fill:#f8fafc; stroke:#cbd5e1; stroke-width:1; }
      .ag { fill:#eef2ff; stroke:#4f46e5; stroke-width:1.2; }
      .me { fill:#ecfdf5; stroke:#059669; stroke-width:1.2; }
      .to { fill:#fff7ed; stroke:#ea580c; stroke-width:1.2; }
      .ll { fill:#f5f3ff; stroke:#7c3aed; stroke-width:1.2; }
      .ob { fill:#f1f5f9; stroke:#64748b; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="1200" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" style="fill:#0f172a;font-size:22px;font-weight:700">ARA-1 · Autonomous Research Agent: Architecture</text>
  <text x="40" y="64" style="fill:#475569;font-size:13px">Hybrid Plan-and-Execute with a bounded ReAct executor · LangGraph StateGraph · zero-cost stack</text>

  <!-- ============ MEMORY COLUMN ============ -->
  <rect class="col" x="40" y="140" width="300" height="678" rx="12"/>
  <text class="h" x="56" y="164">MEMORY LAYER</text>

  <rect class="me" x="56" y="178" width="268" height="84" rx="8"/>
  <text class="t" x="68" y="200">Short-term · ContextManager</text>
  <text class="s" x="68" y="220">token budget 40 / 30 / 20 / 10 %</text>
  <text class="s" x="68" y="237">progressive summarisation of trace</text>
  <text class="s" x="68" y="254">raw outputs → evidence summaries</text>

  <rect class="me" x="56" y="276" width="268" height="100" rx="8"/>
  <text class="t" x="68" y="298">Long-term · Chroma (local)</text>
  <text class="s" x="68" y="318">semantic chunks per document type</text>
  <text class="s" x="68" y="335">ONNX MiniLM embeddings (CPU, free)</text>
  <text class="s" x="68" y="352">filter: ticker · date · source · tier</text>
  <text class="s" x="68" y="369">write policy: verified or conf ≥ 0.7</text>

  <rect class="me" x="56" y="390" width="268" height="84" rx="8"/>
  <text class="t" x="68" y="412">Structured facts · SQLite</text>
  <text class="s" x="68" y="432">XBRL statements stored as JSON</text>
  <text class="s" x="68" y="449">claim ledger (entity·metric·period)</text>
  <text class="s" x="68" y="466">metadata queries, not semantic search</text>

  <rect class="me" x="56" y="488" width="268" height="84" rx="8"/>
  <text class="t" x="68" y="510">Episodic · SQLite</text>
  <text class="s" x="68" y="530">plans and tool usefulness per query type</text>
  <text class="s" x="68" y="547">errors, recoveries, metric scores</text>
  <text class="s" x="68" y="564">LLM-written lessons → planner hints</text>

  <text class="s" x="68" y="610">Staleness check on recall:</text>
  <text class="s" x="68" y="627">market data &gt; 24 h or pre-latest-filing</text>
  <text class="s" x="68" y="644">→ may guide the plan, may not be cited</text>

  <!-- ============ AGENT COLUMN ============ -->
  <rect x="460" y="84" width="240" height="36" rx="18" fill="#0f172a"/>
  <text x="580" y="107" text-anchor="middle" style="fill:#ffffff;font-size:13px;font-weight:600">Research query</text>
  <line class="ln" x1="580" y1="120" x2="580" y2="138" marker-end="url(#arr)"/>

  <g>
    <rect class="ag" x="420" y="140" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="161">analyze_query</text>
    <text class="s" x="436" y="179">classify · resolve tickers/CIKs · disambiguate</text>

    <rect class="ag" x="420" y="210" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="231">recall_memory</text>
    <text class="s" x="436" y="249">vector + episodic recall (memory first)</text>

    <rect class="ag" x="420" y="280" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="301">plan</text>
    <text class="s" x="436" y="319">DAG of steps · tool budget ≤ 20 calls</text>

    <rect class="ag" x="420" y="350" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="371">execute_batch</text>
    <text class="s" x="436" y="389">bounded ReAct (≤ 3 calls/step) · parallel</text>

    <rect class="ag" x="420" y="420" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="441">replan</text>
    <text class="s" x="436" y="459">add / drop / modify steps from new evidence</text>

    <rect class="ag" x="420" y="490" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="511">synthesize</text>
    <text class="s" x="436" y="529">claims · normalise · resolve conflicts · threads</text>

    <rect class="ag" x="420" y="560" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="581">verify</text>
    <text class="s" x="436" y="599">chain-of-verification · recompute · 5 % tolerance</text>

    <rect class="ag" x="420" y="630" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="651">reflect</text>
    <text class="s" x="436" y="669">gaps? section coverage? budget left?</text>

    <rect class="ag" x="420" y="700" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="721">render_report</text>
    <text class="s" x="436" y="739">template · rendered citations · data-gaps section</text>

    <rect class="ag" x="420" y="770" width="320" height="48" rx="8"/>
    <text class="m" x="436" y="791">write_memory</text>
    <text class="s" x="436" y="809">store verified findings + episode record</text>
  </g>

  <!-- vertical flow -->
  <line class="ln" x1="580" y1="188" x2="580" y2="208" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="258" x2="580" y2="278" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="328" x2="580" y2="348" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="398" x2="580" y2="418" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="468" x2="580" y2="488" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="538" x2="580" y2="558" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="608" x2="580" y2="628" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="678" x2="580" y2="698" marker-end="url(#arr)"/>
  <line class="ln" x1="580" y1="748" x2="580" y2="768" marker-end="url(#arr)"/>

  <!-- loops -->
  <path class="ln" d="M740,444 H770 V386 H742" marker-end="url(#arr)"/>
  <text class="l" transform="translate(783,415) rotate(-90)" text-anchor="middle">next batch</text>
  <path class="ln" d="M740,654 H800 V452 H742" marker-end="url(#arr)"/>
  <text class="l" transform="translate(813,553) rotate(-90)" text-anchor="middle">gaps → re-plan</text>

  <!-- output -->
  <line class="ln" x1="580" y1="818" x2="580" y2="844" marker-end="url(#arr)"/>
  <rect x="430" y="846" width="300" height="40" rx="20" fill="#0f172a"/>
  <text x="580" y="871" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:600">Markdown report · claim confidence · gaps</text>

  <!-- memory <-> agent -->
  <line class="ln" x1="340" y1="234" x2="418" y2="234" marker-end="url(#arr)"/>
  <text class="l" x="379" y="228" text-anchor="middle">recall</text>
  <line class="ln" x1="340" y1="304" x2="418" y2="304" marker-end="url(#arr)"/>
  <text class="l" x="379" y="298" text-anchor="middle">hints</text>
  <line class="ln" x1="342" y1="374" x2="418" y2="374" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="l" x="379" y="368" text-anchor="middle">context</text>
  <line class="ln" x1="420" y1="794" x2="342" y2="794" marker-end="url(#arr)"/>
  <text class="l" x="379" y="788" text-anchor="middle">persist</text>

  <!-- ============ TOOL COLUMN ============ -->
  <rect class="col" x="840" y="140" width="320" height="560" rx="12"/>
  <text class="h" x="856" y="164">TOOL LAYER</text>

  <rect class="to" x="856" y="178" width="288" height="60" rx="8"/>
  <text class="t" x="868" y="200">ToolRegistry · 12 tools</text>
  <text class="s" x="868" y="220">JSON-Schema validation · dynamic unlocks</text>
  <text class="s" x="868" y="233">source tier + fallbacks declared per tool</text>

  <rect x="856" y="250" width="288" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-dasharray="4 3"/>
  <text class="t" x="868" y="270">Dispatch pipeline</text>
  <rect class="to" x="864" y="280" width="134" height="32" rx="6"/>
  <text class="s" x="931" y="300" text-anchor="middle">cache · rate limit</text>
  <rect class="to" x="1002" y="280" width="134" height="32" rx="6"/>
  <text class="s" x="1069" y="300" text-anchor="middle">retry 1s·2ⁿ + jitter</text>
  <rect class="to" x="864" y="318" width="134" height="32" rx="6"/>
  <text class="s" x="931" y="338" text-anchor="middle">circuit breaker</text>
  <rect class="to" x="1002" y="318" width="134" height="32" rx="6"/>
  <text class="s" x="1069" y="338" text-anchor="middle">fallback chain</text>

  <rect x="856" y="370" width="288" height="30" rx="6" fill="#ffffff" stroke="#ea580c" stroke-dasharray="2 3"/>
  <text class="s" x="1000" y="390" text-anchor="middle">FailureInjector (C8: 50 % · seeded, below retry)</text>

  <text class="h" x="856" y="424" style="font-size:11px">FREE DATA SOURCES · TIER</text>
  <rect class="to" x="856" y="434" width="288" height="44" rx="6"/>
  <text class="t" x="868" y="452" style="font-size:12px">SEC EDGAR + XBRL company facts</text>
  <text class="s" x="868" y="469">filings, audited financials · T1</text>
  <rect class="to" x="856" y="484" width="288" height="44" rx="6"/>
  <text class="t" x="868" y="502" style="font-size:12px">yfinance</text>
  <text class="s" x="868" y="519">statements, profile, prices · T2</text>
  <rect class="to" x="856" y="534" width="288" height="44" rx="6"/>
  <text class="t" x="868" y="552" style="font-size:12px">Transcripts / 8-K Ex-99 press release</text>
  <text class="s" x="868" y="569">management commentary · T3</text>
  <rect class="to" x="856" y="584" width="288" height="44" rx="6"/>
  <text class="t" x="868" y="602" style="font-size:12px">DuckDuckGo · Google News RSS + VADER</text>
  <text class="s" x="868" y="619">search, news sentiment · T4–T5</text>
  <rect class="to" x="856" y="634" width="288" height="52" rx="6"/>
  <text class="t" x="868" y="652" style="font-size:12px">Local tools</text>
  <text class="s" x="868" y="669">calculation_engine · fact_checker · report_gen</text>
  <text class="s" x="868" y="682">vector_db_search / vector_db_store</text>

  <!-- executor <-> tools -->
  <line class="ln" x1="742" y1="362" x2="838" y2="362" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="l" x="790" y="355" text-anchor="middle">call / evidence</text>

  <!-- LLM layer -->
  <rect class="ll" x="840" y="720" width="320" height="98" rx="12"/>
  <text class="t" x="856" y="744">LLM layer · openai SDK, swap base_url</text>
  <text class="s" x="856" y="766">Gemini free → Groq free → Ollama local → Mock</text>
  <text class="s" x="856" y="784">same retry · breaker · fallback as tools</text>
  <text class="s" x="856" y="802">token + latency accounting per call</text>
  <line class="ln" x1="838" y1="759" x2="742" y2="759" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text class="l" x="790" y="752" text-anchor="middle">LLM (all nodes)</text>

  <!-- ============ OBSERVABILITY ============ -->
  <rect class="ob" x="40" y="910" width="1120" height="56" rx="10"/>
  <text class="h" x="56" y="932">OBSERVABILITY &amp; EVALUATION</text>
  <text class="s" x="56" y="953">JSONL trace per session: thought · decision · action · observation · error · conflict · llm_call  →  Trace Gallery   |   22-metric harness (automated + LLM judge)  →  dashboard</text>
</svg>
